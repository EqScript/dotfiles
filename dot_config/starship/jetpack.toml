# version: 1.0.1
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](dimmed white)"

# Command line layout - character перемещен в конец для стабильности fill
format = """\
($nix_shell$container$fill$git_metrics\n)\
$cmd_duration\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$username\
$character"""

right_format = """\
$singularity\
$kubernetes\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery"""

[fill]
symbol = "⋅"
style = "fg:#323232"

[character]
format = "$symbol "
success_symbol = "[›](bold green)"
error_symbol = "[›](bold red)"
vimcmd_symbol = "[■](green)"
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[username]
style_user = "bright-yellow bold"
style_root = "purple bold"
format = "[ $user]($style) "
disabled = false
show_always = false

[directory]
disabled = true # Отключено, так как путь теперь в Zellij

[cmd_duration]
format = "[◄ $duration ](white)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "white"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[](bold bright-orange)"
style = "bright-green"
truncation_symbol = "⋯"
truncation_length = 11
only_attached = true

[git_status]
style = "bold bright-blue"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"

# Языковые модули (убран italic из префиксов)
[python]
format = " [py](normal) [${symbol}${version}]($style)"
symbol = "[⌉](bold bright-blue)⌊ "
version_format = "${raw}"
style = "bold bright-yellow"

[nodejs]
format = " [node](normal) [◫ ($version)](bold bright-green)"
version_format = "${raw}"

[rust]
format = "[$symbol$version]($style)"
symbol = "  "
version_format = "${raw}"
style = "bold red"

[lua]
format = " [lua](normal) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = " "
style = "bold bright-yellow"

[package]
format = " [pkg](dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow bold"

[nix_shell]
style = 'bold dimmed blue'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](dimmed white)'

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "[󱊣](bold green)"
charging_symbol = "[󰂄](bold bright-green)"
discharging_symbol = "[󱟞](bold yellow)"
