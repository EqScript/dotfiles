#format = """
#[╭─user───❯](bold blue) $username
#[┣─system─❯](bold yellow) $hostname
#[┣─project❯](bold red) $directory$rust$git_branch$git_status$package$golang$terraform$docker_context$python$docker_context$nodejs
#[╰─cmd────❯](bold green) 
#"""
#format = '$all'

# Command line layout
format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = "[╰➜](bold yellow) " 
error_symbol = "[╰](bold yellow)[ ✗](bold red) "

[localip]
ssh_only = false
format = '[◉ ](bold cyan) [$localipv4](bold yellow) '
disabled = false

[username]
style_user = "yellow bold"
style_root = "red bold"
format = "[╭ $user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = false
format = '[◉ ](bold cyan)[$hostname](bold yellow) '
trim_at = "."
disabled = true

[directory]
read_only = " "
truncation_length = 20
truncate_to_repo = true # truncates directory to root folder if in github repo
style = "bold cyan"
format = '[◉ $path](bold cyan) '


[cmd_duration]
min_time = 4
show_milliseconds = false
disabled = false
style = "bold italic yellow"

[fill]
symbol = " " 

[time]
disabled = false
format = '[$time]($style) '
time_format = '%R' # R - 18:00, r - 6:00pm
style = "bold cyan" 

[line_break]
disabled = true

[aws]
symbol = "  "

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "
style = "blue bold"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []
disabled = false

[elixir]
symbol = " "

[elm]
symbol = " "

[golang]
symbol = " "

[git_branch]
style = "bold purple"
format = "[◉ ](bold cyan)[$symbol$branch]($style) "
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[package]
symbol = "󰏗 "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "
#pyenv_version_name = true
format = 'via [${symbol}python (${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"
pyenv_prefix = "venv "
python_binary = ["./venv/bin/python", "python", "python3", "python2"]
detect_extensions = ["py"]
version_format = "v${raw}"

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shlvl]
symbol = " "

[swift]
symbol = "ﯣ "

[nodejs]
format = "via [ Node.js $version](bold green) "
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

