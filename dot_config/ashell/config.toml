log_level = "warn"
outputs = { Targets = ["eDP-1", "DP-1", "DP-2"] }
position = "Bottom"
app_launcher_cmd = "wofi --show drun"

[modules]
left = [ [ "appLauncher", "Updates", "Workspaces" ] ]
center = [ "WindowTitle" ]
right = [ "keyboard_layout", "SystemInfo", [ "Tray", "Clock", "Privacy", "Settings" ] ]

[updates]
check_cmd = "checkupdates; paru -Qua"
update_cmd = 'alacritty -e bash -c "paru; echo Done - Press enter to exit; read" &'

[workspaces]
enable_workspace_filling = true

[keyboard_layout.labels]
"English (US)" = "🇺🇸"
"Russian" = "🇷🇺"

[[CustomModule]]
name = "appLauncher"
icon = "󱗼"
command = "wofi --show drun"

[window_title]
truncate_title_after_length = 100

[settings]
lock_cmd = "playerctl --all-players pause; nixGL hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"


[appearance]
scale_factor = 1.25
style = "Solid"
font = "Hack Nerd Font"

## Colors
success_color = "#70e000"   # battery icon / success indicators
text_color = "#eceff4"      # default text color across widgets

# workspace indicator colors by monitor order
# also used for:
# - active workspace pills/tabs
# - focused workspace highlights
workspace_colors = [
  "#434c5e",  # gray-blue inactive/focused base
  "#cb5500",  # dark amber
  "#fb8500"   # active orange accent
]

# interactive accent color
# used for:
# - active buttons
# - slider fill
# - slider handles
# - selected/toggled controls
[appearance.primary_color]
base = "#fb8500"
weak = "#b35f00"


# structural UI surfaces and inactive elements
# used for:
# - inactive slider tracks
# - separators / borders
# - popup cards
# - device selection panel background
# - some inactive controls
[appearance.secondary_color]
base   = "#434c5e"   # inactive slider track / borders
weak   = "#4c566a"   # softer inactive/hover variants
strong = "#3a4254"   # raised cards / device output panel


# global background palette
# used for:
# - main popup background
# - panel layers
# - inactive buttons
# - dark surfaces
[appearance.background_color]
base   = "#1c212b"   # main popup background
weak   = "#2e3440"   # inactive buttons / secondary surfaces
strong = "#3b4252"   # elevated/hover surfaces


# warning / danger states
# exact mapping depends on widget support
[appearance.danger_color]
base   = "#ffc300"
weak   = "#e6b800"
strong = "#ffd60a"
